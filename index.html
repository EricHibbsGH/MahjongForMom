<p id="live" class="visually-hidden" aria-live="polite"></p>

<dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
  <h2 id="confirm-title">Are you sure?</h2>
  <p id="confirm-text"></p>
  <div class="dialog-actions">
    <button type="button" class="btn btn-secondary" id="confirm-cancel" autofocus>Cancel</button>
    <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
  </div>
</dialog>
